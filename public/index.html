<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>bishal.app — Catalogue</title>
  <meta name="description" content="A catalogue of apps made by Bishal, with live previews." />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Our Catalogue</h1>
    </header>

    <div class="tabs" id="tabs">
      <div class="track">
        <div class="seg" id="seg" role="tablist" aria-label="Apps"></div>
        <div class="seg seg-active" id="seg-active" aria-hidden="true"></div>
      </div>
    </div>

    <p class="tagline" id="tagline" aria-live="polite"></p>

    <section class="window" id="window" role="tabpanel" aria-label="Preview">
      <header class="toolbar">
        <span></span>

        <div class="bar">
          <a class="address" id="address" target="_blank" rel="noopener" title="Open in new tab">
            <svg width="10" height="12" viewBox="0 0 11 13" fill="currentColor" aria-hidden="true"><path d="M2.5 5.5V4a3 3 0 0 1 6 0v1.5h.5A1.5 1.5 0 0 1 10.5 7v4.5A1.5 1.5 0 0 1 9 13H2A1.5 1.5 0 0 1 .5 11.5V7A1.5 1.5 0 0 1 2 5.5h.5zm1.5 0h3V4a1.5 1.5 0 0 0-3 0v1.5z"/></svg>
            <span class="url" id="url"></span>
          </a>
          <a class="go" id="open" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>

        <div class="actions">
          <button class="tool" id="device" type="button" aria-pressed="false" title="Phone preview" aria-label="Toggle phone preview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
          </button>
          <button class="tool" id="reload" type="button" title="Reload" aria-label="Reload preview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          </button>
        </div>
        <span class="progress" aria-hidden="true"></span>
      </header>

      <div class="viewport">
        <iframe class="frame" id="frame" title="App preview" loading="lazy" referrerpolicy="no-referrer"></iframe>
        <div class="blocked" id="blocked"></div>
      </div>
    </section>
  </main>

  <script src="apps.js"></script>
  <script>
    const apps = window.APPS || [];
    const $ = (s) => document.querySelector(s);
    const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const parse = (u) => { try { return new URL(u, location.href); } catch { return null; } };
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");

    const colorVars = (a) => `--c1:${esc(a.colors?.[0] || "#8e8e93")};--c2:${esc(a.colors?.[1] || "#3a3a3c")}`;
    const icon = (a) => `<img class="icon" src="${esc(a.icon)}" alt="" aria-hidden="true">`;

    const tabs = $("#tabs"), seg = $("#seg"), segActive = $("#seg-active");
    const win = $("#window"), frame = $("#frame");

    // Two identical rows: the real tabs, and an "active" copy on top that is
    // clipped down to the selected tab. Moving the clip moves the highlight.
    const tabHTML = (a, i, real) => `
      <button class="tab" type="button" style="${colorVars(a)}" data-i="${i}" ${real
        ? `role="tab" id="tab-${i}" aria-selected="false" aria-controls="window" tabindex="-1"`
        : `tabindex="-1"`}>
        ${icon(a)}<span>${esc(a.name)}</span>
      </button>`;
    seg.innerHTML = apps.map((a, i) => tabHTML(a, i, true)).join("");
    segActive.innerHTML = apps.map((a, i) => tabHTML(a, i, false)).join("");
    const tabEls = [...seg.querySelectorAll(".tab")];

    function placeClip() {
      const t = tabEls[current];
      if (!t) return;
      const right = seg.scrollWidth - t.offsetLeft - t.offsetWidth;
      segActive.style.clipPath = `inset(0 ${right}px 0 ${t.offsetLeft}px round 999px)`;
    }

    // Swap text with a short blur, so old and new read as one change
    function swap(el, html, animate) {
      el.innerHTML = html;
      if (animate && !reduced.matches) {
        el.animate(
          [{ opacity: 0, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0)" }],
          { duration: 220, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }
        );
      }
    }

    let current = -1;
    function select(i, { focus = false, instant = false } = {}) {
      if (i < 0 || i >= apps.length || i === current) return;
      const first = current === -1;
      current = i;
      const a = apps[i];
      const u = parse(a.url);
      const animate = !first && !instant;

      tabEls.forEach((t, n) => {
        t.setAttribute("aria-selected", n === i);
        t.tabIndex = n === i ? 0 : -1;
      });
      win.setAttribute("aria-labelledby", `tab-${i}`);
      if (focus) tabEls[i].focus({ preventScroll: true });

      // Keyboard browsing and first paint jump straight there; clicks glide.
      tabs.toggleAttribute("data-instant", !animate);
      placeClip();
      tabEls[i].scrollIntoView({ inline: "center", block: "nearest", behavior: animate && !reduced.matches ? "smooth" : "auto" });

      history.replaceState(null, "", "#" + (a.slug || slug(a.name)));
      document.title = `${a.name} — bishal.app`;

      const path = u ? (u.pathname === "/" ? "" : u.pathname) : "";
      swap($("#url"), u ? `${esc(u.host.replace(/^www\./, ""))}<span class="path">${esc(path)}</span>` : esc(a.url), animate);
      swap($("#tagline"), esc(a.tagline || ""), animate);
      $("#address").href = $("#open").href = a.url;

      if (a.embed === false) {
        win.classList.add("no-embed");
        win.classList.remove("loading");
        frame.removeAttribute("src");
        $("#blocked").innerHTML = `
          ${icon(a)}
          <h2>${esc(a.name)}</h2>
          <p>This site can't be previewed here. Open it in a new tab instead.</p>
          <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Open ${esc(a.name)}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>`;
      } else {
        win.classList.remove("no-embed");
        load(a.url);
      }
    }

    function load(url) {
      win.classList.remove("loaded");
      void win.offsetWidth; // restart the progress animation
      win.classList.add("loading");
      frame.src = url;
    }
    frame.addEventListener("load", () => {
      if (!frame.getAttribute("src")) return;
      win.classList.replace("loading", "loaded");
    });

    // Interactions
    seg.addEventListener("click", (e) => {
      const t = e.target.closest(".tab");
      if (t) select(+t.dataset.i);
    });
    seg.addEventListener("keydown", (e) => {
      const last = apps.length - 1;
      const to = {
        ArrowRight: Math.min(last, current + 1),
        ArrowLeft: Math.max(0, current - 1),
        Home: 0,
        End: last,
      }[e.key];
      if (to !== undefined) { e.preventDefault(); select(to, { focus: true, instant: true }); }
    });
    $("#reload").addEventListener("click", () => {
      const a = apps[current];
      if (a && a.embed !== false) load(a.url);
    });
    $("#device").addEventListener("click", (e) => {
      const on = win.classList.toggle("phone");
      e.currentTarget.setAttribute("aria-pressed", on);
    });

    // Tab widths change when fonts load or the window resizes
    new ResizeObserver(() => {
      tabs.setAttribute("data-instant", "");
      placeClip();
    }).observe(seg);

    // Start on the app in the URL hash (shareable links), else the first one
    const fromHash = apps.findIndex((a) => (a.slug || slug(a.name)) === location.hash.slice(1));
    select(fromHash >= 0 ? fromHash : 0);
  </script>

</body>
</html>
