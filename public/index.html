<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>bishal.app — Catalogue</title>
  <meta name="description" content="A catalogue of apps made by Bishal, with live previews." />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>Our Catalogue</h1>
    </header>

    <div class="picker">
      <span class="lens" id="lens" aria-hidden="true"></span>
      <div class="tabs" id="tabs">
        <div class="seg" id="seg" role="tablist" aria-label="Apps"></div>
      </div>
    </div>

    <p class="tagline" id="tagline" aria-live="polite"></p>

    <section class="window" id="window" role="tabpanel" aria-label="Preview">
      <header class="toolbar">
        <span></span>

        <div class="bar">
          <a class="address" id="address" target="_blank" rel="noopener" title="Open in new tab">
            <svg width="10" height="12" viewBox="0 0 11 13" fill="currentColor" aria-hidden="true"><path d="M2.5 5.5V4a3 3 0 0 1 6 0v1.5h.5A1.5 1.5 0 0 1 10.5 7v4.5A1.5 1.5 0 0 1 9 13H2A1.5 1.5 0 0 1 .5 11.5V7A1.5 1.5 0 0 1 2 5.5h.5zm1.5 0h3V4a1.5 1.5 0 0 0-3 0v1.5z"/></svg>
            <span class="url" id="url"></span>
          </a>
          <a class="go" id="open" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>

        <div class="actions">
          <button class="tool" id="device" type="button" aria-pressed="false" title="Phone preview" aria-label="Toggle phone preview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
          </button>
          <button class="tool" id="reload" type="button" title="Reload" aria-label="Reload preview">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          </button>
        </div>
        <span class="progress" aria-hidden="true"></span>
      </header>

      <div class="viewport">
        <iframe class="frame" id="frame" title="App preview" loading="lazy" referrerpolicy="no-referrer"></iframe>
        <div class="blocked" id="blocked"></div>
      </div>
    </section>
  </main>

  <script src="apps.js"></script>
  <script>
    const apps = window.APPS || [];
    const $ = (s) => document.querySelector(s);
    const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const parse = (u) => { try { return new URL(u, location.href); } catch { return null; } };
    const clamp = (i) => Math.min(apps.length - 1, Math.max(0, i));
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");

    const colorVars = (a) => `--c1:${esc(a.colors?.[0] || "#8e8e93")};--c2:${esc(a.colors?.[1] || "#3a3a3c")}`;
    const icon = (a) => `<img class="icon" src="${esc(a.icon)}" alt="" aria-hidden="true">`;

    const tabs = $("#tabs"), seg = $("#seg"), lens = $("#lens");
    const win = $("#window"), frame = $("#frame");

    // A picker, like a watch's date window: the lens stays put in the middle
    // and the apps scroll through it. Whatever sits in the lens is selected.
    seg.innerHTML = apps.map((a, i) => `
      <button class="tab" type="button" role="tab" id="tab-${i}" aria-selected="false"
        aria-controls="window" tabindex="-1" style="${colorVars(a)}" data-i="${i}">
        <span class="face">${icon(a)}<span>${esc(a.name)}</span></span>
      </button>`).join("");
    const tabEls = [...seg.querySelectorAll(".tab")];
    const faces = tabEls.map((t) => t.firstElementChild);

    const centerOf = (t) => t.offsetLeft + t.offsetWidth / 2;
    const scrollFor = (i) => centerOf(tabEls[i]) - tabs.clientWidth / 2;

    function nearest() {
      const mid = tabs.scrollLeft + tabs.clientWidth / 2;
      let best = 0;
      tabEls.forEach((t, i) => {
        if (Math.abs(centerOf(t) - mid) < Math.abs(centerOf(tabEls[best]) - mid)) best = i;
      });
      return best;
    }

    // Fade and shrink apps the further they are from the lens, like a wheel
    function paint() {
      const mid = tabs.scrollLeft + tabs.clientWidth / 2;
      tabEls.forEach((t, i) => {
        const d = Math.min(3, Math.abs(centerOf(t) - mid) / t.offsetWidth);
        faces[i].style.opacity = 1 - d * 0.28;
        faces[i].style.transform = reduced.matches ? "" : `scale(${1 - d * 0.06})`;
      });
    }

    // Swap text with a short blur, so old and new read as one change
    const swaps = new Map();
    function swap(el, html, animate) {
      if (el.innerHTML === html) return;
      el.innerHTML = html;
      swaps.get(el)?.cancel();
      if (animate && !reduced.matches) {
        swaps.set(el, el.animate(
          [{ opacity: 0, filter: "blur(3px)" }, { opacity: 1, filter: "blur(0)" }],
          { duration: 200, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }
        ));
      }
    }

    // Show which app is in the lens. Cheap, so it runs live while scrolling.
    let current = -1;
    function highlight(i, animate = true) {
      if (i === current) return;
      current = i;
      const a = apps[i];
      const u = parse(a.url);

      tabEls.forEach((t, n) => {
        const on = n === i;
        t.classList.toggle("on", on);
        t.setAttribute("aria-selected", on);
        t.tabIndex = on ? 0 : -1;
      });
      lens.style.cssText = colorVars(a);
      win.setAttribute("aria-labelledby", `tab-${i}`);

      history.replaceState(null, "", "#" + (a.slug || slug(a.name)));
      document.title = `${a.name} — bishal.app`;

      const path = u ? (u.pathname === "/" ? "" : u.pathname) : "";
      swap($("#url"), u ? `${esc(u.host.replace(/^www\./, ""))}<span class="path">${esc(path)}</span>` : esc(a.url), animate);
      swap($("#tagline"), esc(a.tagline || ""), animate);
      $("#address").href = $("#open").href = a.url;
    }

    // Load the preview once the picker comes to rest, so a flick across
    // every app doesn't start a page load for each one it passes.
    let shown = -1;
    function commit() {
      target = null;
      paint();
      highlight(nearest()); // scrollend can land before the last frame's update
      if (current === shown) return;
      shown = current;
      const a = apps[current];

      if (a.embed === false) {
        win.classList.add("no-embed");
        win.classList.remove("loading");
        frame.removeAttribute("src");
        $("#blocked").innerHTML = `
          ${icon(a)}
          <h2>${esc(a.name)}</h2>
          <p>This site can't be previewed here. Open it in a new tab instead.</p>
          <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Open ${esc(a.name)}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>`;
      } else {
        win.classList.remove("no-embed");
        load(a.url);
      }
    }

    // Scroll an app into the lens
    let target = null;
    function goTo(i, { smooth = true } = {}) {
      target = i = clamp(i);
      const glide = smooth && !reduced.matches;
      tabs.scrollTo({ left: scrollFor(i), behavior: glide ? "smooth" : "instant" });
      if (!glide) { paint(); highlight(i, false); commit(); }
    }

    function load(url) {
      win.classList.remove("loaded");
      void win.offsetWidth; // restart the progress animation
      win.classList.add("loading");
      frame.src = url;
    }
    frame.addEventListener("load", () => {
      if (!frame.getAttribute("src")) return;
      win.classList.replace("loading", "loaded");
    });

    // Scrolling: repaint every frame, update the lens live, load on rest
    let frameReq = 0, settle = 0;
    tabs.addEventListener("scroll", () => {
      cancelAnimationFrame(frameReq);
      frameReq = requestAnimationFrame(() => { paint(); highlight(nearest()); });
      clearTimeout(settle);
      settle = setTimeout(commit, 160); // fallback where scrollend isn't supported
    }, { passive: true });
    tabs.addEventListener("scrollend", () => { clearTimeout(settle); commit(); });

    // A vertical mouse wheel turns the picker one app per notch, like a crown.
    // Sideways trackpad swipes scroll natively and snap on their own.
    let wheelSum = 0, wheelIdle = 0;
    tabs.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
      e.preventDefault();
      wheelSum += e.deltaY;
      clearTimeout(wheelIdle);
      wheelIdle = setTimeout(() => (wheelSum = 0), 180);
      if (Math.abs(wheelSum) < 40) return;
      goTo((target ?? current) + Math.sign(wheelSum));
      wheelSum = 0;
    }, { passive: false });

    seg.addEventListener("click", (e) => {
      const t = e.target.closest(".tab");
      if (t) goTo(+t.dataset.i);
    });
    // Keyboard steps jump straight there: no glide for repeated key presses
    seg.addEventListener("keydown", (e) => {
      const to = { ArrowRight: current + 1, ArrowLeft: current - 1, Home: 0, End: apps.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      goTo(to, { smooth: false });
      tabEls[current].focus({ preventScroll: true });
    });
    $("#reload").addEventListener("click", () => {
      const a = apps[current];
      if (a && a.embed !== false) load(a.url);
    });
    $("#device").addEventListener("click", (e) => {
      const on = win.classList.toggle("phone");
      e.currentTarget.setAttribute("aria-pressed", on);
    });

    // Keep the selected app centred when the picker changes width
    new ResizeObserver(() => {
      if (current >= 0) { tabs.scrollTo({ left: scrollFor(current), behavior: "instant" }); paint(); }
    }).observe(tabs);

    // Start on the app in the URL hash (shareable links), else the first one
    const fromHash = apps.findIndex((a) => (a.slug || slug(a.name)) === location.hash.slice(1));
    goTo(fromHash >= 0 ? fromHash : 0, { smooth: false });
  </script>

</body>
</html>
